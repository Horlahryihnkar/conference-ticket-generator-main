<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Conference ticket generator</title>

</head>
<body>

  <img class="deco lines" src="assets\images\pattern-lines.svg" alt="">

  <img class="deco circle circle-top" src="assets\images\pattern-circle.svg" alt="">
  
  <img class="deco circle circle-right" src="assets/images/pattern-circle.svg" alt="">

  <img class="deco swirl-top" src="assets/images/pattern-lines.svg" alt="">

  <img class="deco swirl-bottom" src="assets/images/pattern-squiggly-line-top.svg" alt="">

  <header class="hero">
    <img class="logo" src="assets/images/logo-full.svg" alt="Coding Conf">

    <h1>Your Journey to Coding Conf 2025 Starts Here!</h1>
    <p class="subtitle">Secure your spot at next year’s biggest coding conference.</p>
  </header>  

  <main>

    <form class="ticket-form" action="#" method="post">

      <div class="field">
        <span class="label">Upload Avatar</span>
        <label class="dropzone" tabindex="0">
          <span class="icon-box">
            <img src="assets\images\icon-upload.svg" alt="">
          </span>
          <span class="dropzone-text">Drag and drop or click to upload</span>
          <input type="file" id="avatar" name="avatar" accept="image/png, image/jpeg">
        </label>
        <p class="hint">
          <img src="assets\images\icon-info.svg" alt="">
          <span>Upload your photo (JPG or PNG, max size: 500KB).</span>
        </p>
      </div>
      
      <div class="field">
        <label class="label" for="full-name">Full Name</label>
        <input type="text" required id="name" name="name">
      </div>
          
      <div class="field">
        <label class="label" for="email">Email Address</label> 
        <input id="email" type="email" name="email" required placeholder="example@email.com">
      </div>
      
      <div class="field">
        <label class="label" for="github">GitHub Username</label>
        <input id="github" type="text" name="github" required placeholder="@yourusername"> 
      </div>
      
      <button type="submit">Generate My Ticket</button>

    </form>
  </main>
  
 </body>
</html>
